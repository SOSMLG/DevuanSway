# mpv — SwaySetup defaults (Wayland-native, nerd-friendly).
# TUI-first player: keyboard over mouse, GPU over CPU.
# Full keys: https://mpv.io/manual/stable/ — essentials:
#   SPACE/q pause/quit, f fullscreen, m mute, 9/0 or / * volume,
#   arrows/hjkl seek, [/] speed, s screenshot, T ontop, j cycle subs.
vo=gpu-next
gpu-context=wayland
hwdec=auto-safe
profile=high-quality
scale=ewa_lanczossharp
video-sync=display-resample
audio-channels=auto
volume=80
volume-max=150
save-position-on-quit=yes
osc=no
osd-bar=yes
osd-duration=1200
screenshot-directory=~/Pictures/screenshots
screenshot-format=png
ytdl-format=bv*[height<=1080]+ba/b[height<=1080]/bv*+ba/b
cache=yes
demuxer-max-bytes=256MiB
