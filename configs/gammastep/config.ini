# gammastep — night-light daemon config (used by `swayctl toggle night`).
# Valid keys only: gammastep wants plain integers (no `K` suffix) under
# [general]; there is no [colors] section and no dawn/dusk clock times —
# schedule comes from lat/lon. Defaults to Bangkok (keyboard ships us+th);
# change to your own coords (https://latlong.net) or `swayctl setup` walks
# you through it.
[general]
adjustment-method=wayland
fade=1
temp-day=6500
temp-night=3600
location-provider=manual

[manual]
lat=13.7563
lon=100.5018
