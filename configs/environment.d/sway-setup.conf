# SwaySetup — Wayland session environment (user-level).
# Picked up by interactive shells from ~/.profile (see 20-shell-tools.sh),
# which exports each line literally — so NO $VAR references here (neither
# $HOME nor systemd's %h would survive both consumers); use plain values.
# Keep native Wayland backends so Electron/Qt/GTK apps don't trampoline to X.
GDK_BACKEND=wayland
QT_QPA_PLATFORM=wayland
QT_QUICK_CONTROLS_STYLE=org.kde.desktop
ELECTRON_OZONE_PLATFORM_HINT=auto
MOZ_ENABLE_WAYLAND=1
XDG_CURRENT_DESKTOP=sway
XDG_SESSION_TYPE=wayland
# TUI-first defaults: $TERMINAL is honored by swayctl term_bin().
TERMINAL=foot
EDITOR=nvim
VISUAL=nvim
BROWSER=firefox