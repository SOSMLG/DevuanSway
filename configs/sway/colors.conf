set $mantle  #181825
set $crust   #11111b
set $surface #313244
set $surface1 #45475a
set $surface2 #585b70
set $overlay #6c7086
set $text    #cdd6f4
set $subtext #a6adc8
set $subtext1 #bac2de
set $accent  #f38ba8
set $red     #f38ba8
set $pink    #f5c2e7
set $purple  #cba6f7
set $mauve   #cba6f7
set $blue    #89b4fa
set $teal    #94e2d5
set $green   #a6e3a1
set $yellow  #f9e2af
set $orange  #fab387